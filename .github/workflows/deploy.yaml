name : Deploy the nextjs app to Ec2 using Github Actions 

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build the Next.js app
        run: npm run build

      - name: Build the Docker image using GHCR
        run: docker build -t ghcr.io/harikrish2525/my-nextjs-app:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push the Docker image to GHCR
        run: docker push ghcr.io/harikrish2525/my-nextjs-app:${{ github.sha }}



deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          github_token: ${{ secrets.GHCR_PAT }}
          script: |
            docker pull ghcr.io/harikrish2525/my-nextjs-app:${{ github.sha }}
            docker stop my-nextjs-app || true
            docker rm my-nextjs-app || true
            docker run -d --name my-nextjs-app -p 3000:3000 ghcr.io/harikrish2525/my-nextjs-app:${{ github.sha }}
