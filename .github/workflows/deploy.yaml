name: Deploy the application to EC2 with GHCR using GitHub Actions

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/harikrishna2525/my-app:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/harikrishna2525/my-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo \"${{ secrets.GHCR_PAT }}\" | docker login ghcr.io -u harikrishna2525 --password-stdin",
              "docker pull ghcr.io/harikrishna2525/my-app:${{ github.sha }}",
              "docker stop my-app || true",
              "docker rm my-app || true",
              "docker run -d --restart unless-stopped --name my-app -p 3000:3000 ghcr.io/harikrishna2525/my-app:${{ github.sha }}"
            ]'