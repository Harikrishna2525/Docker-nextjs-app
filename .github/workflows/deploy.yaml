name : Deploy a Nextjs App to Build an GHCR Image and push into Ec2 

on :
  push:
    branches:
      - main 
      - master

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        run: npm install

      - name: Build the Next.js app
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image to GHCR
        run: |
         docker build -t ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }} .
         docker push ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}
            docker stop nextjs-app || true
            docker rm nextjs-app || true
            docker run -d --restart unless-stopped --name nextjs-app -p 3000:3000 ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}
