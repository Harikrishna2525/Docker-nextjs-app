name: Deploy a Nextjs App to Build a GHCR Image and Deploy to EC2


on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Image
        run: |
          docker build -t ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }} .
          docker push ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
          --instance-ids i-0f01423a363f2e752 \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
          "echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u harikrishna2525 --password-stdin",
          "docker pull ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}",
          "docker stop nextjs-app || true",
          "docker rm nextjs-app || true",
          "docker run -d --restart unless-stopped --name nextjs-app -p 3000:3000 ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}"
          ]'


