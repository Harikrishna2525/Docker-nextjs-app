
name: Deploy Node.js application using GHCR

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  docker-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: codeql

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build the Docker image
        run: |
          docker build \
            -t ghcr.io/harikrishna2525/my-nodejs-app:${{ github.sha }} \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/harikrishna2525/my-nodejs-app:${{ github.sha }}
          version: v0.76.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: vuln

      - name: Push the Docker image to GHCR
        run: |
          docker push ghcr.io/harikrishna2525/my-nodejs-app:${{ github.sha }}

