name: deploy the nodejs application using GHCR in Github Actions

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Upgraded to v4 for security and performance

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3 # Upgraded to v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run: |
          docker build -t ghcr.io/harikrishna2525/my-nodejs-app:latest .

      - name: Push the Docker image to GitHub Container Registry
        run: |
          docker push ghcr.io/harikrishna2525/my-nodejs-app:latest

      - name: Deploy to the Ec2 using SSM
        uses: aws-actions/aws-ssm-run-command@v2
        with:
          document-name: AWS-RunShellScript
          # Note: Ensure your target string maps perfectly to AWS SSM expectations
          targets: '[{"Key":"tag:Name","Values":["${{ secrets.EC2_INSTANCE_ID }}"]}]'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # CRITICAL: Change this to your exact EC2 instance region
          parameters: |
            commands:
              - |
                echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                docker pull ghcr.io/harikrishna2525/my-nodejs-app:latest
                docker stop my-nodejs-app || true
                docker rm my-nodejs-app || true
                docker run -d --name my-nodejs-app -p 3000:3000 ghcr.io/harikrishna2525/my-nodejs-app:latest
            
