name: Deploy a Nextjs App to Build a GHCR Image and Deploy to EC2


on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Image
        run: |
          docker build -t ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }} .
          docker push ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u harikrishna2525 --password-stdin

            docker pull ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}

            docker stop nextjs-app || true
            docker rm nextjs-app || true

            docker run -d \
              --restart unless-stopped \
              --name nextjs-app \
              -p 3000:3000 \
              ghcr.io/harikrishna2525/docker-nextjs-app:${{ github.sha }}

