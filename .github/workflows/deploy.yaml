
name: Node.js Security Scanning and GHCR Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    needs: gitleaks
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  docker-push:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest
    needs: codeql
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image locally
        run: |
          docker build \
            -t ghcr.io/harikrishna2525/nextjs-new:${{ github.sha }} \
            .

      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ghcr.io/harikrishna2525/nextjs-new:${{ github.sha }}
      #     format: table
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'
      #     scanners: vuln

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        run: |
          docker push ghcr.io/harikrishna2525/nextjs-new:${{ github.sha }}

          docker tag \
            ghcr.io/harikrishna2525/nextjs-new:${{ github.sha }} \
            ghcr.io/harikrishna2525/nextjs-new:latest

          docker push ghcr.io/harikrishna2525/nextjs-new:latest
