name: Deploy the nextjs app to Ec2 using Github Actions 

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log into GHCR using your PAT token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Build the Docker image using the strictly lowercase path: harikrishna2525
      - name: Build the Docker image using GHCR
        run: docker build -t ghcr.io/harikrishna2525/my-nextjs-app:${{ github.sha }} .

      # Push the image to the lowercase path
      - name: Push the Docker image to GHCR
        run: docker push ghcr.io/harikrishna2525/my-nextjs-app:${{ github.sha }}

        
      # Log into your AWS account
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your actual AWS EC2 region

      # Send the SSM Command to EC2 using the lowercase image path
      - name: Deploy to EC2 via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Next.js App" \
            --parameters "commands=[
              \"export CR_PAT=${{ secrets.GHCR_PAT }}\",
              \"echo \$CR_PAT | docker login ghcr.io -u Harikrishna2525 --password-stdin\",
              \"docker pull ghcr.io/harikrishna2525/my-nextjs-app:${{ github.sha }}\",
              \"docker stop my-nextjs-app || true\",
              \"docker rm my-nextjs-app || true\",
              \"docker run -d --name my-nextjs-app -p 3000:3000 ghcr.io/harikrishna2525/my-nextjs-app:${{ github.sha }}\"
            ]" \
            --query "Command.CommandId" \
            --output text
