apiVersion: apps/v1
kind: Deployment

metadata:
  name: nextjs-deployment-cluster

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nextjs

  template:
    metadata:
      labels:
        app: nextjs

    spec:
      containers:
        - name: nextjs-container
          image: nextjs-app:latest

          ports:
            - containerPort: 3000

          imagePullPolicy: IfNotPresent